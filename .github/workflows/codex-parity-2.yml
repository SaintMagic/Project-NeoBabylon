name: Codex parity second review
on:
  push:
    branches: [review/codex-product-parity-2026-10-05]
    paths: ['.github/workflows/codex-parity-2.yml', 'patches/codex-parity-2/**', 'docs/WIP/codex-parity-2/check.py']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Exact isolated source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source config core.autocrlf false
          git -C source remote add origin https://github.com/SaintMagic/Project-NeoBabylon.git
          git -C source fetch origin 9ebde217fa5de22a67e8c00a14b5f1ba51b32170
          git -C source checkout -b snapshot FETCH_HEAD
          mkdir evidence
          git -C source bundle create ../evidence/source.bundle snapshot
          git -C source ls-tree -r HEAD > evidence/source-tree.txt
          git -C source rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: UI baseline
        working-directory: source/ui/diagnostic
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object ../../../evidence/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test 2>&1 | Tee-Object ../../../evidence/ui-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build 2>&1 | Tee-Object ../../../evidence/ui-build.log
          exit $LASTEXITCODE
      - name: CSharp baseline
        if: always()
        working-directory: source
        shell: pwsh
        run: |
          dotnet run --project tests/product-parity/NeoBabylon.ProductParity.Tests.csproj -c Release 2>&1 | Tee-Object ../evidence/product-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build host/NeoBabylon.Host/NeoBabylon.Host.csproj -c Release 2>&1 | Tee-Object ../evidence/host-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/host/NeoBabylon.Phase1A.Tests.csproj -c ApprovalQA 2>&1 | Tee-Object ../evidence/host-tests-build.log
          exit $LASTEXITCODE
      - name: QA baseline
        if: always()
        working-directory: source
        shell: pwsh
        run: |
          node --test tests/qa/nvidia-adapter-bundle.test.mjs tests/qa/qa-run-root.test.mjs 2>&1 | Tee-Object ../evidence/qa-tests.log
          exit $LASTEXITCODE
      - name: Record environment
        if: always()
        shell: pwsh
        run: |
          node --version | Out-File evidence/environment.txt
          dotnet --info | Out-File evidence/environment.txt -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: neobabylon-parity-2-baseline
          path: evidence/
          retention-days: 14
