name: Codex parity second review package
on:
  push:
    branches:
      - review/codex-product-parity-2026-10-05

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          import json
          import pathlib
          import shutil

          root = pathlib.Path(".")
          transfer_dir = root / ".github" / "parity-2-transfer"
          transfer = "".join((transfer_dir / f"part{i}.b64").read_text() for i in range(3))
          transfer = "".join(transfer.split())
          transfer += "=" * (-len(transfer) % 4)
          raw = gzip.decompress(base64.b64decode(transfer))
          files = json.loads(raw)
          package = root / "NeoBabylon_Codex_Parity_Review_2_2026-10-05"
          package.mkdir(exist_ok=True)

          for name, content in files.items():
              target = package / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8", newline="\n")

          manifest = (
              "# NeoBabylon Codex Product Parity Review 2\n\n"
              "Reviewed source: `9ebde217fa5de22a67e8c00a14b5f1ba51b32170`.\n\n"
              "Contains the complete second-pass patch payload and verification helpers. "
              "Fresh clean-baseline Windows evidence is packaged separately by ChatGPT into the final delivered ZIP.\n"
          )
          (package / "README_PACKAGE.md").write_text(manifest, encoding="utf-8", newline="\n")

          sums = []
          for path in sorted(package.rglob("*")):
              if path.is_file():
                  sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(package).as_posix()}")
          (package / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8", newline="\n")
          shutil.make_archive("NeoBabylon_Codex_Parity_Review_2_2026-10-05", "zip", package)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NeoBabylon-Codex-Parity-Review-2-payload
          path: NeoBabylon_Codex_Parity_Review_2_2026-10-05.zip
          retention-days: 14
          if-no-files-found: error
