name: Codex parity second review transfer export
on:
  push:
    branches:
      - review/codex-product-parity-2026-10-05
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neobabylon-parity-2-transfer-raw
          path: .github/parity-2-transfer/
          retention-days: 14
          if-no-files-found: error
