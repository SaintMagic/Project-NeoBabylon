name: Codex product parity patch checks

on:
  push:
    branches: [review/codex-product-parity-2026-10-04]
    paths: [.github/workflows/codex-product-parity-check.yml, 'patches/codex-parity/**', docs/WIP/codex-parity/verify-patches.py]

permissions:
  contents: read

jobs:
  patch-checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Fetch isolated review branch and exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = review/codex-product-parity-2026-10-04
          git init review
          git -C review remote add origin https://github.com/SaintMagic/Project-NeoBabylon.git
          git -C review fetch origin "$GITHUB_SHA" f126612a00231a58626d72108aac6ee912431ee3
          git -C review checkout --detach "$GITHUB_SHA"
          mkdir evidence
          git -C review rev-parse HEAD > evidence/review-artifact-commit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Independent dependency combinations and exact reverse checks
        working-directory: review
        shell: pwsh
        run: |
          python docs/WIP/codex-parity/verify-patches.py --output ../evidence/patch-verification.json 2>&1 | Tee-Object ../evidence/patch-verification.log
          exit $LASTEXITCODE
      - name: Apply cumulative series in disposable source worktree
        id: apply
        working-directory: review
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          target = root.parent / 'source'
          subprocess.run(['git','worktree','add','--detach',str(target),'f126612a00231a58626d72108aac6ee912431ee3'],check=True)
          for patch in sorted((root/'patches/codex-parity').glob('*.patch')):
              subprocess.run(['git','apply','--check','--index',str(patch)],cwd=target,check=True)
              subprocess.run(['git','apply','--index',str(patch)],cwd=target,check=True)
      - name: UI tests and production build
        id: ui
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: source/ui/diagnostic
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object ../../../evidence/patched-npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test 2>&1 | Tee-Object ../../../evidence/patched-ui-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build 2>&1 | Tee-Object ../../../evidence/patched-ui-build.log
          exit $LASTEXITCODE
      - name: Source-only product regressions
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: source
        shell: pwsh
        run: |
          dotnet run --project tests/product-parity/NeoBabylon.ProductParity.Tests.csproj -c Release 2>&1 | Tee-Object ../evidence/patched-product-tests.log
          exit $LASTEXITCODE
      - name: Native host and test harness build
        id: host
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: source
        shell: pwsh
        run: |
          dotnet build host/NeoBabylon.Host/NeoBabylon.Host.csproj -c Release 2>&1 | Tee-Object ../evidence/patched-host-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/host/NeoBabylon.Phase1A.Tests.csproj -c ApprovalQA 2>&1 | Tee-Object ../evidence/patched-host-fixture-build.log
          exit $LASTEXITCODE
      - name: Existing exact-identity and synthetic credential probes
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        working-directory: source
        shell: pwsh
        run: |
          dotnet run --no-build --project tests/host/NeoBabylon.Phase1A.Tests.csproj -c ApprovalQA -- --probe-rename-saved-thread 2>&1 | Tee-Object ../evidence/patched-rename-capability.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tests/host/NeoBabylon.Phase1A.Tests.csproj -c ApprovalQA -- --probe-development-credential-records 2>&1 | Tee-Object ../evidence/patched-credentials.log
          exit $LASTEXITCODE
      - name: Adapter bundle and Windows QA path checks
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: source
        shell: pwsh
        run: |
          node --test tests/qa/nvidia-adapter-bundle.test.mjs tests/qa/qa-run-root.test.mjs 2>&1 | Tee-Object ../evidence/patched-qa-tests.log
          exit $LASTEXITCODE
      - name: Synthetic browser flows and layout-copy checks
        if: ${{ !cancelled() && steps.ui.outcome == 'success' }}
        working-directory: source
        shell: pwsh
        run: |
          npm install --prefix ../review-tools --ignore-scripts --no-audit --no-fund playwright-core@1.56.0 2>&1 | Tee-Object ../evidence/patched-browser-tools.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .local/Lab/Runs | Out-Null
          node tests/qa/ui-accessibility.mjs "$env:GITHUB_WORKSPACE/review-tools/node_modules/playwright-core/index.mjs" --product-parity 2>&1 | Tee-Object ../evidence/patched-ui-accessibility.log
          $result = $LASTEXITCODE
          Get-ChildItem .local/Lab/Runs -Recurse -File | Where-Object { $_.Extension -in '.json','.png','.txt' } | ForEach-Object { Copy-Item $_.FullName ../evidence/ -Force }
          exit $result
      - name: Environment evidence
        if: always()
        shell: pwsh
        run: |
          node --version | Out-File evidence/environment.txt
          npm --version | Out-File evidence/environment.txt -Append
          dotnet --info | Out-File evidence/environment.txt -Append
          if (Test-Path source) { git -C source diff --cached --stat | Out-File evidence/patched-source-diff.txt }
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neobabylon-patch-verification
          path: evidence/
          retention-days: 14
          if-no-files-found: error
