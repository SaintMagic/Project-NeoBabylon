name: Codex product review evidence

on:
  push:
    branches: [review/codex-product-parity-2026-10-04]
    paths: [.github/workflows/codex-product-review.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact published source and interrupted review package
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/SaintMagic/Project-NeoBabylon.git
          git -C source fetch origin f126612a00231a58626d72108aac6ee912431ee3 5e5798797f04b19124404b94adc327bcfcd141ec
          mkdir evidence
          for ref in f126612a00231a58626d72108aac6ee912431ee3 5e5798797f04b19124404b94adc327bcfcd141ec; do
            git -C source archive --format=tar --output="$GITHUB_WORKSPACE/evidence/source-$ref.tar" "$ref"
            git -C source ls-tree -r "$ref" > "evidence/tree-$ref.txt"
            git -C source cat-file commit "$ref" > "evidence/commit-$ref.txt"
          done
          sha256sum evidence/*.tar > evidence/SHA256SUMS
      - name: Retain public source snapshots for isolated review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-neobabylon-review-snapshots
          path: evidence/
          retention-days: 14
          if-no-files-found: error
