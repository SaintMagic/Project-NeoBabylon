name: Codex product review build

on:
  push:
    branches: [review/codex-product-parity-2026-10-04]
    paths: [.github/workflows/codex-product-review-build.yml]

permissions:
  contents: read

jobs:
  windows-source-checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/SaintMagic/Project-NeoBabylon.git
          git -C source fetch --depth=1 origin f126612a00231a58626d72108aac6ee912431ee3
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = f126612a00231a58626d72108aac6ee912431ee3
          mkdir evidence
          git -C source rev-parse HEAD > evidence/source-commit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install locked UI dependencies
        working-directory: source/ui/diagnostic
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object ../../../evidence/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: UI tests and build
        if: always()
        working-directory: source/ui/diagnostic
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object ../../../evidence/ui-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build 2>&1 | Tee-Object ../../../evidence/ui-build.log
          exit $LASTEXITCODE
      - name: Pinned Astryx component contracts
        working-directory: source/ui/diagnostic
        shell: pwsh
        run: |
          npm run astryx -- component Button 2>&1 | Tee-Object ../../../evidence/astryx-button.txt
          npm run astryx -- component IconButton 2>&1 | Tee-Object ../../../evidence/astryx-icon-button.txt
      - name: Native host and fixture builds
        if: always()
        working-directory: source
        shell: pwsh
        run: |
          dotnet build host/NeoBabylon.Host/NeoBabylon.Host.csproj -c Release 2>&1 | Tee-Object ../evidence/host-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/host/NeoBabylon.Phase1A.Tests.csproj -c ApprovalQA 2>&1 | Tee-Object ../evidence/host-fixture-build.log
          exit $LASTEXITCODE
      - name: Pure protocol and protected binding checks
        if: always()
        working-directory: source
        shell: pwsh
        run: |
          dotnet run --no-build --project tests/host/NeoBabylon.Phase1A.Tests.csproj -c ApprovalQA -- --probe-rename-saved-thread 2>&1 | Tee-Object ../evidence/rename-capability-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tests/host/NeoBabylon.Phase1A.Tests.csproj -c ApprovalQA -- --probe-development-credential-records 2>&1 | Tee-Object ../evidence/development-credentials-tests.log
          exit $LASTEXITCODE
      - name: Adapter bundle checks
        if: always()
        working-directory: source
        shell: pwsh
        run: |
          node --test tests/qa/nvidia-adapter-bundle.test.mjs 2>&1 | Tee-Object ../evidence/adapter-bundle-tests.log
          exit $LASTEXITCODE
      - name: Synthetic Edge UI acceptance
        if: always()
        working-directory: source
        shell: pwsh
        run: |
          npm install --prefix ../review-tools --ignore-scripts --no-audit --no-fund playwright-core@1.56.0 2>&1 | Tee-Object ../evidence/browser-tools.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .local/Lab/Runs | Out-Null
          node tests/qa/ui-accessibility.mjs "$env:GITHUB_WORKSPACE/review-tools/node_modules/playwright-core/index.mjs" 2>&1 | Tee-Object ../evidence/ui-accessibility.log
          $result = $LASTEXITCODE
          Get-ChildItem .local/Lab/Runs -Recurse -File | Where-Object { $_.Extension -in '.json','.png','.txt' } | ForEach-Object { Copy-Item $_.FullName ../evidence/ -Force }
          exit $result
      - name: Environment versions
        if: always()
        shell: pwsh
        run: |
          node --version | Out-File evidence/environment.txt
          npm --version | Out-File evidence/environment.txt -Append
          dotnet --info | Out-File evidence/environment.txt -Append
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neobabylon-baseline-build-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
